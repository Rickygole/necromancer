name: oracle-linux

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - legacy/UICALC.cbl
      - case_studies/carddemo_interest/INTWRAP.cbl
      - case_studies/carddemo_interest/build.py
      - case_studies/carddemo_interest/vendor/**
      - .github/workflows/oracle-linux.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container: amazonlinux:2023@sha256:8ee95c4096d455555cb208d1dcea7b759235afab02253351d566d22d904f2198
    steps:
      - name: Install build tools
        run: dnf install -y gcc make tar xz gzip python3 glibc-static git findutils which m4 diffutils file dnf-plugins-core
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Record the glibc used
        run: |
          rpm -q glibc glibc-static glibc-common | tee glibc-versions.txt
          GV=$(rpm -q --qf '%{VERSION}-%{RELEASE}' glibc)
          echo "$GV" > glibc-version.txt
          dnf download --source "glibc-$GV"
          ls -l glibc-*.src.rpm
          sha256sum glibc-*.src.rpm | tee glibc-src-rpm.sha256
      - name: Build GMP
        run: |
          curl -fsSL -o gmp.tar.xz https://ftp.gnu.org/gnu/gmp/gmp-6.3.0.tar.xz
          echo "a3c2b80201b89e68616f4ad30bc66aee4927c3ce50e33929ca819d5c43538898  gmp.tar.xz" | sha256sum -c -
          tar xf gmp.tar.xz
          cd gmp-6.3.0
          CFLAGS="-O2 -fPIC" ./configure --prefix=/opt/cobol --disable-shared --enable-static --with-pic
          make -j4
          make install
      - name: Build GnuCOBOL 3.1.2
        run: |
          curl -fsSL -o gnucobol.tar.gz https://ftp.gnu.org/gnu/gnucobol/gnucobol-3.1.2.tar.gz
          echo "f38c60b38a9e404bcba709b61b46f2bafa146b5f3dd90a94b2a70f5cea2f6297  gnucobol.tar.gz" | sha256sum -c -
          tar xzf gnucobol.tar.gz
          cd gnucobol-3.1.2
          CFLAGS="-O2 -fPIC" CPPFLAGS="-I/opt/cobol/include" LDFLAGS="-L/opt/cobol/lib" ./configure --prefix=/opt/cobol --disable-shared --enable-static --without-db --without-curses --without-xml2 --without-json
          make -j4
          make install
      - name: Compile the oracle statically
        run: |
          export PATH=/opt/cobol/bin:$PATH
          mkdir -p bin
          COB_LDFLAGS="-static" COB_LIBS="-L/opt/cobol/lib -lcob -lgmp -lm" cobc -x -free -o bin/uicalc legacy/UICALC.cbl
          file bin/uicalc || true
          ldd bin/uicalc || true
          printf 'CLM000001001250050000800000000900000000070000000200045N00000000000000N               \n' | ./bin/uicalc
      - name: Compile the CardDemo oracle statically
        run: |
          export PATH=/opt/cobol/bin:$PATH
          python3 -c "from case_studies.carddemo_interest import build; build.write_sources('cd-build')"
          COB_LDFLAGS="-static" COB_LIBS="-L/opt/cobol/lib -lcob -lgmp -lm" cobc -x -I cd-build -I case_studies/carddemo_interest/vendor -o bin/intwrap case_studies/carddemo_interest/INTWRAP.cbl
          file bin/intwrap || true
          printf '+00000000000+00000010000+000600\n' | ./bin/intwrap
      - name: Collect artifacts
        run: |
          cp bin/intwrap intwrap-linux-x64
          sha256sum intwrap-linux-x64 | cut -d' ' -f1 > intwrap-linux-x64.sha256
          (cd case_studies/carddemo_interest && sha256sum INTWRAP.cbl vendor/CBACT04C.cbl vendor/CVTRA01Y.cpy vendor/CVTRA02Y.cpy) > intwrap-source.sha256
          cp bin/uicalc uicalc-linux-x64
          cp gmp.tar.xz gmp-6.3.0.tar.xz
          cp gnucobol.tar.gz gnucobol-3.1.2.tar.gz
          sha256sum legacy/UICALC.cbl | cut -d' ' -f1 > uicalc-source.sha256
          sha256sum uicalc-linux-x64 | cut -d' ' -f1 > uicalc-linux-x64.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oracle
          path: |
            uicalc-linux-x64
            uicalc-source.sha256
            uicalc-linux-x64.sha256
            intwrap-linux-x64
            intwrap-linux-x64.sha256
            intwrap-source.sha256
            gmp-6.3.0.tar.xz
            gnucobol-3.1.2.tar.gz
            glibc-*.src.rpm
            glibc-versions.txt
            glibc-src-rpm.sha256

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: oracle
      - name: Publish release asset
        run: |
          gh release delete oracle-latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create oracle-latest uicalc-linux-x64 uicalc-linux-x64.sha256 uicalc-source.sha256 intwrap-linux-x64 intwrap-linux-x64.sha256 intwrap-source.sha256 case_studies/carddemo_interest/NOTICE gmp-6.3.0.tar.xz gnucobol-3.1.2.tar.gz glibc-*.src.rpm glibc-versions.txt glibc-src-rpm.sha256 THIRD_PARTY_NOTICES.md licenses/GPL-3.0.txt licenses/LGPL-3.0.txt licenses/LGPL-2.1.txt --repo "$GITHUB_REPOSITORY" --title "Oracle binary" --notes "Static Linux build of UICALC compiled with GnuCOBOL 3.1.2.0"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
