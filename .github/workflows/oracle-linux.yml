name: oracle-linux

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - legacy/UICALC.cbl
      - .github/workflows/oracle-linux.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: amazonlinux:2023
    steps:
      - name: Install build tools
        run: dnf install -y gcc make tar xz gzip glibc-static git findutils which m4 diffutils file
      - uses: actions/checkout@v4
      - name: Build GMP
        run: |
          curl -fsSL -o gmp.tar.xz https://ftp.gnu.org/gnu/gmp/gmp-6.3.0.tar.xz
          tar xf gmp.tar.xz
          cd gmp-6.3.0
          CFLAGS="-O2 -fPIC" ./configure --prefix=/opt/cobol --disable-shared --enable-static --with-pic
          make -j4
          make install
      - name: Build GnuCOBOL 3.1.2
        run: |
          curl -fsSL -o gnucobol.tar.gz https://ftp.gnu.org/gnu/gnucobol/gnucobol-3.1.2.tar.gz
          tar xzf gnucobol.tar.gz
          cd gnucobol-3.1.2
          CFLAGS="-O2 -fPIC" CPPFLAGS="-I/opt/cobol/include" LDFLAGS="-L/opt/cobol/lib" ./configure --prefix=/opt/cobol --disable-shared --enable-static --without-db --without-curses --without-xml2 --without-json
          make -j4
          make install
      - name: Compile the oracle statically
        run: |
          export PATH=/opt/cobol/bin:$PATH
          mkdir -p bin
          COB_LDFLAGS="-static" COB_LIBS="-L/opt/cobol/lib -lcob -lgmp -lm" cobc -x -free -o bin/uicalc legacy/UICALC.cbl
          file bin/uicalc || true
          ldd bin/uicalc || true
          printf 'CLM000001001250050000800000000900000000070000000200045N00000000000000N               \n' | ./bin/uicalc
      - name: Collect artifacts
        run: |
          cp bin/uicalc uicalc-linux-x64
          sha256sum legacy/UICALC.cbl | cut -d' ' -f1 > uicalc-source.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: oracle
          path: |
            uicalc-linux-x64
            uicalc-source.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: oracle
      - name: Publish release asset
        run: |
          gh release delete oracle-latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create oracle-latest uicalc-linux-x64 uicalc-source.sha256 THIRD_PARTY_NOTICES.md --repo "$GITHUB_REPOSITORY" --title "Oracle binary" --notes "Static Linux build of UICALC compiled with GnuCOBOL 3.1.2.0"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
