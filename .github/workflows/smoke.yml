name: smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Smoke test production
        env:
          HOSTED_EXPECT_ORACLE: "1"
        run: sh scripts/smoke.sh https://necromancer-rickygole32-8911s-projects.vercel.app
